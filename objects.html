<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Объекты — PH.GENIER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    /* ===== DESIGN SYSTEM ===== */
    :root {
      --bg-primary:        #080808;
      --bg-secondary:      #0F0F0D;
      --bg-surface:        #161614;
      --bg-card:           #1A1A18;
      --accent-gold:       #C8A97E;
      --accent-gold-light: #E2C99E;
      --accent-gold-dim:   #6B5A3E;
      --text-primary:      #F0EDE8;
      --text-secondary:    #8A8780;
      --text-muted:        #4A4845;
      --border-gold:       rgba(200, 169, 126, 0.12);
      --border-subtle:     rgba(240, 237, 232, 0.06);
      --nav-bg:            rgba(8, 8, 8, 0.92);
      --pill-bg:           rgba(240, 237, 232, 0.06);
      --pill-border:       rgba(240, 237, 232, 0.08);
      --pill-active:       rgba(200, 169, 126, 0.15);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'Jost', 'DM Sans', sans-serif;
      --text-h2:      clamp(28px, 3.5vw, 48px);
      --ease-out: cubic-bezier(0.25, 0, 0, 1);
    }

    [data-theme="light"] {
      --bg-primary:        #F5F3EF;
      --bg-secondary:      #EDEAE4;
      --bg-surface:        #E8E5DF;
      --bg-card:           #DFDCD6;
      --accent-gold:       #A68B5B;
      --accent-gold-light: #BFA474;
      --accent-gold-dim:   #C4B599;
      --text-primary:      #1A1A18;
      --text-secondary:    #5A5850;
      --text-muted:        #9A978F;
      --border-gold:       rgba(166, 139, 91, 0.18);
      --border-subtle:     rgba(26, 26, 24, 0.08);
      --nav-bg:            rgba(245, 243, 239, 0.92);
      --pill-bg:           rgba(26, 26, 24, 0.05);
      --pill-border:       rgba(26, 26, 24, 0.08);
      --pill-active:       rgba(166, 139, 91, 0.18);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 16px;
      color: var(--text-primary);
      background: var(--bg-primary);
      line-height: 1.6;
      transition: background 0.5s ease, color 0.5s ease;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
    img { max-width: 100%; display: block; }

    /* ===== NAV (same as index) ===== */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 64px; padding: 0 40px;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--nav-bg);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-gold);
      transition: background 0.4s ease;
    }
    .nav__logo {
      font-family: var(--font-display); font-size: 22px; font-weight: 400;
      letter-spacing: 0.06em; color: var(--text-primary); white-space: nowrap;
    }
    .nav__logo-r { font-style: italic; }
    .nav__menu {
      display: flex; align-items: center; gap: 4px;
      background: var(--pill-bg); border: 1px solid var(--pill-border);
      border-radius: 100px; padding: 4px;
    }
    .nav__menu a {
      font-size: 12px; font-weight: 300; letter-spacing: 0.04em;
      color: var(--text-secondary); padding: 8px 20px; border-radius: 100px;
      transition: color 0.25s, background 0.25s; white-space: nowrap;
    }
    .nav__menu a:hover { color: var(--text-primary); }
    .nav__menu a.active { background: var(--pill-active); color: var(--text-primary); }
    .nav__right { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
    .nav__socials { display: flex; align-items: center; gap: 12px; }
    .nav__social { color: var(--text-muted); transition: color 0.25s; display: flex; }
    .nav__social:hover { color: var(--accent-gold); }
    .nav__social svg { width: 15px; height: 15px; fill: currentColor; }
    .nav__theme-toggle {
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border-subtle); border-radius: 50%;
      color: var(--text-muted); transition: color 0.3s, border-color 0.3s; padding: 0;
    }
    .nav__theme-toggle:hover { color: var(--accent-gold); border-color: var(--accent-gold); }
    .nav__theme-toggle svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav__theme-toggle .icon-moon { display: block; }
    .nav__theme-toggle .icon-sun { display: none; }
    [data-theme="light"] .nav__theme-toggle .icon-moon { display: none; }
    [data-theme="light"] .nav__theme-toggle .icon-sun { display: block; }
    .nav__divider { width: 1px; height: 24px; background: var(--border-subtle); }
    .nav__phone-link {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 400; color: var(--text-primary); white-space: nowrap;
    }
    .nav__phone-icon {
      width: 28px; height: 28px; background: var(--accent-gold); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .nav__phone-icon svg { width: 12px; height: 12px; stroke: var(--bg-primary); fill: none; stroke-width: 2; }
    [data-theme="light"] .nav__phone-icon svg { stroke: #fff; }
    .nav__hamburger { display: none; flex-direction: column; gap: 5px; padding: 8px; }
    .nav__hamburger span { display: block; width: 20px; height: 1px; background: var(--text-primary); }

    @media (max-width: 768px) {
      .nav { padding: 0 20px; }
      .nav__menu, .nav__socials, .nav__divider, .nav__phone-link, .nav__theme-toggle { display: none; }
      .nav__hamburger { display: flex; }
    }

    /* ===== PAGE LAYOUT ===== */
    .page {
      max-width: 1440px;
      margin: 0 auto;
      padding: 96px 80px 80px;
    }

    @media (max-width: 768px) {
      .page { padding: 80px 20px 48px; }
    }

    /* ===== PAGE HEADER ===== */
    .page-header {
      margin-bottom: 40px;
    }

    .page-header__label {
      font-size: 10px; font-weight: 300; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--accent-gold); margin-bottom: 12px;
    }

    .page-header__title {
      font-family: var(--font-display); font-weight: 300;
      font-size: var(--text-h2); color: var(--text-primary);
    }

    /* ===== FILTERS ===== */
    .filters {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 28px 32px;
      margin-bottom: 32px;
    }

    .filters__row {
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr 1fr;
      gap: 20px;
      align-items: end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-label {
      font-size: 10px; font-weight: 300; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--text-muted);
    }

    .filter-select,
    .filter-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 10px 14px;
      font-family: var(--font-body);
      font-size: 13px; font-weight: 300;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.3s;
      -webkit-appearance: none;
      border-radius: 0;
    }

    .filter-select:focus,
    .filter-input:focus {
      border-color: var(--accent-gold);
    }

    .filter-select option {
      background: var(--bg-surface);
      color: var(--text-primary);
    }

    .filter-range {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .filter-range__sep {
      color: var(--text-muted);
      font-size: 12px;
    }

    /* Tags */
    .filters__tags {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .filter-tag {
      font-size: 12px; font-weight: 300; letter-spacing: 0.03em;
      color: var(--text-secondary);
      padding: 7px 18px;
      border: 1px solid var(--border-subtle);
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.25s;
      white-space: nowrap;
    }

    .filter-tag:hover {
      border-color: var(--accent-gold);
      color: var(--text-primary);
    }

    .filter-tag.active {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
      color: var(--bg-primary);
      font-weight: 400;
    }

    [data-theme="light"] .filter-tag.active {
      color: #fff;
    }

    .filters__reset {
      font-size: 12px; font-weight: 300;
      color: var(--text-muted);
      margin-left: auto;
      cursor: pointer;
      transition: color 0.25s;
      background: none; border: none;
    }

    .filters__reset:hover {
      color: var(--accent-gold);
    }

    @media (max-width: 1024px) {
      .filters__row {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 640px) {
      .filters__row {
        grid-template-columns: 1fr;
      }
      .filters {
        padding: 20px;
      }
    }

    /* ===== OBJECT CARDS ===== */
    .objects-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .object-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      padding: 40px 0;
      border-top: 1px solid var(--border-subtle);
      align-items: start;
    }

    .object-card:last-child {
      border-bottom: 1px solid var(--border-subtle);
    }

    /* Left — info */
    .obj__header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .obj__name {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(24px, 3vw, 32px);
      color: var(--text-primary);
      line-height: 1.2;
    }

    .obj__badge {
      font-size: 10px; font-weight: 300; letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-gold);
      border: 1px solid var(--border-gold);
      padding: 4px 12px;
      border-radius: 100px;
      white-space: nowrap;
    }

    .obj__location {
      font-size: 13px; font-weight: 300;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .obj__desc {
      font-size: 14px; font-weight: 300;
      color: var(--text-secondary);
      line-height: 1.7;
      max-width: 480px;
      margin-bottom: 24px;
    }

    /* Price section */
    .obj__price-main {
      font-family: var(--font-display);
      font-size: clamp(22px, 2.5vw, 28px);
      font-weight: 400;
      color: var(--accent-gold);
      margin-bottom: 16px;
    }

    .obj__price-table {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 20px;
    }

    .obj__price-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-subtle);
      align-items: baseline;
    }

    .obj__price-row:last-child {
      border-bottom: none;
    }

    .obj__price-config {
      font-size: 13px; font-weight: 300;
      color: var(--text-secondary);
    }

    .obj__price-config span {
      color: var(--text-muted);
      font-size: 12px;
    }

    .obj__price-val {
      font-size: 13px; font-weight: 400;
      color: var(--text-primary);
      text-align: right;
      white-space: nowrap;
    }

    .obj__meta {
      font-size: 12px; font-weight: 300;
      color: var(--text-muted);
    }

    /* Right — photos */
    .obj__photos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .obj__photo {
      aspect-ratio: 4 / 3;
      overflow: hidden;
    }

    .obj__photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s var(--ease-out);
    }

    .obj__photo:hover img {
      transform: scale(1.05);
    }

    .obj__photo:first-child {
      grid-column: 1 / -1;
      aspect-ratio: 16 / 9;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .object-card {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    @media (max-width: 640px) {
      .object-card {
        padding: 28px 0;
      }

      .obj__photos {
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .obj__photo:first-child {
        grid-column: 1 / -1;
      }
    }

    /* ===== REVEAL ===== */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.9s var(--ease-out), transform 0.9s var(--ease-out);
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>

  <script>
    // Theme
    (function() {
      const saved = localStorage.getItem('phg-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else {
        const hour = new Date().getHours();
        document.documentElement.setAttribute('data-theme', hour >= 7 && hour < 19 ? 'light' : 'dark');
      }
    })();
    document.getElementById('themeToggle').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('phg-theme', next);
    });

    // Filter tags
    document.querySelectorAll('.filter-tag').forEach(tag => {
      tag.addEventListener('click', () => tag.classList.toggle('active'));
    });

    // Objects data

      {
        name: 'ЭкоПарк Жуковка',

        meta: 'Срок сдачи: 2025',
        photos: [
          'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=800&q=80',

        ]
      }
    ];

    // Render
    const list = document.getElementById('objectsList');
    objects.forEach((obj, i) => {
      const card = document.createElement('article');
      card.className = 'object-card reveal';
      card.style.transitionDelay = (i * 0.1) + 's';

      const configRows = obj.configs.map(c =>
        `<div class="obj__price-row">
          <span class="obj__price-config">${c.type} <span>${c.area}</span></span>
          <span class="obj__price-val">${c.price}</span>
        </div>`
      ).join('');

      const photoCards = obj.photos.map((src, pi) =>
        `<div class="obj__photo"><img src="${src}" alt="${obj.name}" loading="lazy"></div>`
      ).join('');

      card.innerHTML = `
        <div class="obj__info">
          <div class="obj__header">
            <h2 class="obj__name">${obj.name}</h2>
            <span class="obj__badge">${obj.badge}</span>
          </div>
          <p class="obj__location">${obj.location}</p>
          <p class="obj__desc">${obj.desc}</p>
          <p class="obj__price-main">${obj.priceMain}</p>
          <div class="obj__price-table">${configRows}</div>
          <p class="obj__meta">${obj.meta}</p>
        </div>
        <div class="obj__photos">${photoCards}</div>
      `;
      list.appendChild(card);
    });

    // Reveal
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.08 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>
