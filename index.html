<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PH.GENIER — Премиальная недвижимость</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    /* ===== DESIGN SYSTEM — CSS VARIABLES ===== */
    :root {
      /* Colors */
      --bg-primary:        #080808;
      --bg-secondary:      #0F0F0D;
      --bg-surface:        #161614;
      --bg-card:           #1A1A18;
      --accent-gold:       #C8A97E;
      --accent-gold-light: #E2C99E;
      --accent-gold-dim:   #6B5A3E;
      --text-primary:      #F0EDE8;
      --text-secondary:    #8A8780;
      --text-muted:        #4A4845;
      --border-gold:       rgba(200, 169, 126, 0.12);
      --border-subtle:     rgba(240, 237, 232, 0.06);
      --overlay-dark:      rgba(8, 8, 8, 0.72);

      /* Typography */
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'Jost', 'DM Sans', sans-serif;

      --text-hero:    clamp(52px, 8vw, 96px);
      --text-h1:      clamp(36px, 5vw, 64px);
      --text-h2:      clamp(28px, 3.5vw, 48px);
      --text-h3:      clamp(20px, 2.5vw, 32px);
      --text-label:   11px;
      --text-body:    16px;
      --text-small:   13px;

      /* Animation */
      --ease-out: cubic-bezier(0.25, 0, 0, 1);
    }

    /* ===== GLOBAL RESET & BASE ===== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: var(--text-body);
      color: var(--text-primary);
      background: var(--bg-primary);
      line-height: 1.6;
      border-radius: 0;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul, ol {
      list-style: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
      color: inherit;
    }

    /* ===== LAYOUT ===== */
    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 80px;
    }

    @media (max-width: 768px) {
      .container {
        padding: 0 24px;
      }
    }

    /* ===== REVEAL ANIMATIONS ===== */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.9s var(--ease-out), transform 0.9s var(--ease-out);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal:nth-child(2) { transition-delay: 0.12s; }
    .reveal:nth-child(3) { transition-delay: 0.24s; }
    .reveal:nth-child(4) { transition-delay: 0.36s; }

    /* ===== BLOCK 1 — NAVIGATION ===== */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 64px;
      padding: 0 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
      border-bottom: 1px solid transparent;
      transition: background 0.4s ease, border-bottom 0.4s ease;
    }

    .nav.scrolled {
      background: rgba(8, 8, 8, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-gold);
    }

    /* Logo */
    .nav__logo {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--text-primary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav__logo-r {
      font-style: italic;
    }

    /* Menu */
    .nav__menu {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .nav__menu a {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      transition: color 0.25s;
    }

    .nav__menu a:hover {
      color: var(--text-primary);
    }

    /* Right zone */
    .nav__right {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-shrink: 0;
    }

    /* Divider */
    .nav__divider {
      width: 1px;
      height: 36px;
      background: var(--border-subtle);
      align-self: center;
    }

    /* Contacts */
    .nav__contacts {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav__phone-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .nav__phone {
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 400;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .nav__status {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 1px;
    }

    .nav__status-dot {
      width: 6px;
      height: 6px;
      background: #5A8A5A;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .nav__status-text {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 300;
      color: #5A8A5A;
      white-space: nowrap;
    }

    .nav__address-block {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .nav__address-icon {
      flex-shrink: 0;
      margin-top: 2px;
    }

    .nav__address-icon svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: var(--text-secondary);
      stroke-width: 1.5;
    }

    .nav__address-lines {
      display: flex;
      flex-direction: column;
    }

    .nav__address-line1 {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 300;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .nav__address-line2 {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 300;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Hamburger */
    .nav__hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      padding: 8px;
    }

    .nav__hamburger span {
      display: block;
      width: 20px;
      height: 1px;
      background: var(--text-primary);
      transition: transform 0.3s var(--ease-out), opacity 0.3s;
    }

    .nav__hamburger.active span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }

    .nav__hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .nav__hamburger.active span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }

    /* Mobile overlay */
    .nav__overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99;
      background: var(--bg-primary);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 32px;
      opacity: 0;
      transition: opacity 0.4s var(--ease-out);
    }

    .nav__overlay.open {
      display: flex;
      opacity: 1;
    }

    .nav__overlay a {
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: 400;
      color: var(--text-primary);
      transition: color 0.25s;
    }

    .nav__overlay a:hover {
      color: var(--accent-gold);
    }

    .nav__overlay-phone {
      position: absolute;
      bottom: 48px;
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 300;
      color: var(--text-secondary);
    }

    /* Mobile nav */
    @media (max-width: 768px) {
      .nav {
        padding: 0 24px;
      }

      .nav__menu,
      .nav__divider,
      .nav__contacts {
        display: none;
      }

      .nav__hamburger {
        display: flex;
      }
    }

    /* ===== SECTION PLACEHOLDERS ===== */
    section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Block 2 — Hero */
    .section-hero {
      background: var(--bg-primary);
    }

    /* Block 3 — About / USP */
    .section-about {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-gold);
    }

    /* Block 4 — Catalog */
    .section-catalog {
      background: var(--bg-primary);
      border-top: 1px solid var(--border-gold);
    }

    /* Block 5 — Featured Object */
    .section-featured {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-gold);
    }

    /* Block 6 — Team */
    .section-team {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-gold);
    }

    /* Block 7 — Services */
    .section-services {
      background: var(--bg-primary);
      border-top: 1px solid var(--border-gold);
    }

    /* Block 8 — Geography */
    .section-geography {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-gold);
    }

    /* Block 9 — Testimonials */
    .section-testimonials {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-gold);
    }

    /* Block 10 — Contact / CTA */
    .section-contact {
      background: var(--bg-primary);
      border-top: 1px solid var(--border-gold);
    }

    /* Block 11 — Footer */
    .section-footer {
      background: var(--bg-primary);
      min-height: auto;
      padding: 80px 0;
      border-top: 1px solid var(--border-gold);
    }
  </style>
</head>
<body>

  <!-- BLOCK 1 — Navigation -->
  <nav class="nav" id="nav">
    <a href="#" class="nav__logo">PH.GENIE<span class="nav__logo-r">R</span></a>

    <div class="nav__menu">
      <a href="#catalog">Каталог</a>
      <a href="#team">Команда</a>
      <a href="#featured">Объекты</a>
      <a href="#contact">Контакты</a>
    </div>

    <div class="nav__right">
      <div class="nav__divider"></div>
      <div class="nav__contacts">
        <div class="nav__phone-block">
          <a href="tel:+79060311066" class="nav__phone">+7 (906) 031-10-66</a>
          <div class="nav__status">
            <span class="nav__status-dot"></span>
            <span class="nav__status-text">Сейчас работаем</span>
          </div>
        </div>
        <div class="nav__address-block">
          <span class="nav__address-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
          </span>
          <div class="nav__address-lines">
            <span class="nav__address-line1">Калининград, Московский пр-т 40</span>
            <span class="nav__address-line2">Балтийский Бизнес Центр 14 этаж</span>
          </div>
        </div>
      </div>
    </div>

    <button class="nav__hamburger" id="hamburger" aria-label="Открыть меню">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Mobile overlay -->
  <div class="nav__overlay" id="mobileMenu">
    <a href="#catalog">Каталог</a>
    <a href="#team">Команда</a>
    <a href="#featured">Объекты</a>
    <a href="#contact">Контакты</a>
    <a href="tel:+79060311066" class="nav__overlay-phone">+7 (906) 031-10-66</a>
  </div>

  <!-- BLOCK 2 — Hero -->
  <section class="section-hero" id="hero"></section>

  <!-- BLOCK 3 — About / USP -->
  <section class="section-about" id="about"></section>

  <!-- BLOCK 4 — Catalog -->
  <section class="section-catalog" id="catalog"></section>

  <!-- BLOCK 5 — Featured Object -->
  <section class="section-featured" id="featured"></section>

  <!-- BLOCK 6 — Team -->
  <section class="section-team" id="team"></section>

  <!-- BLOCK 7 — Services -->
  <section class="section-services" id="services"></section>

  <!-- BLOCK 8 — Geography -->
  <section class="section-geography" id="geography"></section>

  <!-- BLOCK 9 — Testimonials -->
  <section class="section-testimonials" id="testimonials"></section>

  <!-- BLOCK 10 — Contact / CTA -->
  <section class="section-contact" id="contact"></section>

  <!-- BLOCK 11 — Footer -->
  <section class="section-footer" id="footer"></section>

  <script>
    // Scroll behavior — nav background
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 60) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }
    }, { passive: true });

    // Mobile hamburger
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      mobileMenu.classList.toggle('open');
      document.body.style.overflow = mobileMenu.classList.contains('open') ? 'hidden' : '';
    });

    // Close mobile menu on link click
    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('active');
        mobileMenu.classList.remove('open');
        document.body.style.overflow = '';
      });
    });

    // Reveal on scroll (IntersectionObserver)
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>
</body>
</html>
