<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PH.GENIER — Управление каталогом</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary:        #080808;
      --bg-secondary:      #0C0C0A;
      --bg-surface:        #121210;
      --bg-card:           #1A1A18;
      --accent-gold:       rgba(223, 189, 105, 1);
      --accent-gold-light: rgba(146, 111, 52, 1);
      --accent-gold-dim:   rgba(146, 111, 52, 0.6);
      --accent-glow:       rgba(223, 189, 105, 0.08);
      --text-primary:      #F0EDE8;
      --text-secondary:    #8A8780;
      --text-muted:        #4A4845;
      --border-gold:       rgba(223, 189, 105, 0.15);
      --border-subtle:     rgba(240, 237, 232, 0.06);
      --nav-bg:            rgba(8, 8, 8, 0.95);
      --pill-bg:           rgba(240, 237, 232, 0.06);
      --pill-border:       rgba(240, 237, 232, 0.08);
      --pill-active:       rgba(223, 189, 105, 0.18);
      --danger:            rgba(200, 70, 70, 1);
      --danger-light:      rgba(220, 100, 100, 1);
      --success:           rgba(90, 138, 90, 1);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'Jost', 'DM Sans', sans-serif;
      --ease-out: cubic-bezier(0.25, 0, 0, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    [data-theme="light"] {
      --bg-primary:        #F5F3EF;
      --bg-secondary:      #EDEAE4;
      --bg-surface:        #E8E5DF;
      --bg-card:           #DFDCD6;
      --accent-gold:       rgba(131, 130, 95, 1);
      --accent-gold-light: rgba(163, 162, 126, 1);
      --accent-gold-dim:   rgba(90, 89, 64, 1);
      --accent-glow:       rgba(131, 130, 95, 0.06);
      --text-primary:      #1A1A18;
      --text-secondary:    #5A5850;
      --text-muted:        #9A978F;
      --border-gold:       rgba(131, 130, 95, 0.20);
      --border-subtle:     rgba(26, 26, 24, 0.08);
      --nav-bg:            rgba(245, 243, 239, 0.95);
      --pill-bg:           rgba(26, 26, 24, 0.05);
      --pill-border:       rgba(26, 26, 24, 0.08);
      --pill-active:       rgba(131, 130, 95, 0.20);
      --danger:            rgba(180, 60, 60, 1);
      --danger-light:      rgba(200, 90, 90, 1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 15px;
      color: var(--text-primary);
      background: var(--bg-primary);
      line-height: 1.6;
      transition: background 0.5s ease, color 0.5s ease;
      overflow-x: hidden;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0.025;
      pointer-events: none;
      z-index: 9999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 128px 128px;
    }

    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
    input, select, textarea { font-family: inherit; }
    img { max-width: 100%; display: block; }

    /* ===== SIDEBAR ===== */
    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-subtle);
      padding: 32px 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: background 0.5s ease;
    }

    .sidebar__logo {
      display: flex;
      align-items: center;
      padding: 0 28px;
      margin-bottom: 40px;
    }

    .sidebar__logo img {
      height: 24px;
      width: auto;
      object-fit: contain;
    }

    .sidebar__nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 0 16px;
      flex: 1;
    }

    .sidebar__link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 300;
      color: var(--text-secondary);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .sidebar__link:hover {
      background: var(--pill-bg);
      color: var(--text-primary);
    }

    .sidebar__link.active {
      background: var(--pill-active);
      color: var(--text-primary);
      font-weight: 400;
    }

    .sidebar__link svg {
      width: 18px; height: 18px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      flex-shrink: 0;
    }

    .sidebar__bottom {
      padding: 0 16px;
      border-top: 1px solid var(--border-subtle);
      padding-top: 16px;
    }

    .sidebar__footer {
      font-size: 11px;
      color: var(--text-muted);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .theme-toggle {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border-subtle);
      border-radius: 50%;
      color: var(--text-muted);
      transition: color 0.3s, border-color 0.3s;
    }

    .theme-toggle:hover {
      color: var(--accent-gold);
      border-color: var(--accent-gold);
    }

    .theme-toggle svg {
      width: 14px; height: 14px;
      stroke: currentColor; fill: none; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }

    .theme-toggle .icon-moon { display: block; }
    .theme-toggle .icon-sun { display: none; }
    [data-theme="light"] .theme-toggle .icon-moon { display: none; }
    [data-theme="light"] .theme-toggle .icon-sun { display: block; }

    /* ===== MAIN CONTENT ===== */
    .main {
      margin-left: 260px;
      min-height: 100vh;
      padding: 40px 48px;
    }

    /* ===== HEADER ===== */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 40px;
      gap: 20px;
    }

    .page-header__label {
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }

    .page-header__title {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(28px, 3vw, 40px);
      color: var(--text-primary);
      line-height: 1.15;
    }

    .page-header__actions {
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }

    /* ===== BUTTONS ===== */
    .btn {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.06em;
      padding: 10px 24px;
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.35s var(--ease-spring);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn svg {
      width: 14px; height: 14px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .btn--primary {
      background: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      color: #fff;
    }

    .btn--primary:hover {
      background: var(--accent-gold-light);
      border-color: var(--accent-gold-light);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .btn--secondary {
      background: transparent;
      border: 1px solid var(--border-gold);
      color: var(--text-primary);
    }

    .btn--secondary:hover {
      border-color: var(--accent-gold);
      background: var(--pill-bg);
    }

    .btn--danger {
      background: var(--danger);
      border: 1px solid var(--danger);
      color: #fff;
    }

    .btn--danger:hover {
      background: var(--danger-light);
      border-color: var(--danger-light);
    }

    .btn--sm {
      font-size: 11px;
      padding: 8px 16px;
    }

    .btn--icon {
      width: 32px; height: 32px;
      padding: 0;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ===== STATS ===== */
    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      border-color: var(--border-gold);
    }

    .stat-card__value {
      font-family: var(--font-display);
      font-size: clamp(28px, 3vw, 36px);
      font-weight: 400;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .stat-card__label {
      font-size: 12px;
      font-weight: 300;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ===== TABLE ===== */
    .table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
    }

    .table-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-subtle);
      gap: 16px;
      flex-wrap: wrap;
    }

    .table-search {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 100px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 300;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.3s;
      width: 280px;
    }

    .table-search::placeholder { color: var(--text-muted); }
    .table-search:focus { border-color: var(--accent-gold); }

    .table-filters {
      display: flex;
      gap: 8px;
    }

    .table-filter {
      font-size: 12px;
      font-weight: 300;
      padding: 8px 16px;
      border-radius: 100px;
      border: 1px solid var(--border-subtle);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .table-filter:hover { border-color: var(--accent-gold); color: var(--text-primary); }
    .table-filter.active { background: var(--accent-gold); border-color: var(--accent-gold); color: #fff; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      text-align: left;
      padding: 14px 24px;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    thead th:hover { color: var(--text-secondary); }

    tbody tr {
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.2s ease;
    }

    tbody tr:hover { background: var(--bg-surface); }
    tbody tr:last-child { border-bottom: none; }

    tbody td {
      padding: 16px 24px;
      font-size: 14px;
      font-weight: 300;
      color: var(--text-secondary);
      vertical-align: middle;
    }

    .td-name {
      font-weight: 400;
      color: var(--text-primary);
      font-size: 15px;
    }

    .td-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 300;
      padding: 4px 12px;
      border-radius: 100px;
      background: var(--accent-glow);
      color: var(--accent-gold);
      border: 1px solid var(--border-gold);
      white-space: nowrap;
    }

    .td-price {
      font-weight: 400;
      color: var(--accent-gold);
    }

    .td-actions {
      display: flex;
      gap: 8px;
    }

    .td-photo-thumb {
      width: 48px;
      height: 36px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }

    .empty-state {
      text-align: center;
      padding: 80px 40px;
      color: var(--text-muted);
    }

    .empty-state__icon {
      width: 48px; height: 48px;
      margin: 0 auto 20px;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 1.5;
    }

    .empty-state__text {
      font-size: 15px;
      margin-bottom: 8px;
    }

    .empty-state__sub {
      font-size: 13px;
      color: var(--text-muted);
      opacity: 0.6;
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.open {
      display: flex;
      opacity: 1;
    }

    .modal {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      width: 90%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
      transform: scale(0.95);
      transition: transform 0.4s var(--ease-spring);
    }

    .modal-overlay.open .modal {
      transform: scale(1);
    }

    .modal__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 32px 0;
    }

    .modal__title {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: 24px;
      color: var(--text-primary);
    }

    .modal__close {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      transition: all 0.3s ease;
    }

    .modal__close:hover {
      border-color: var(--accent-gold);
      color: var(--text-primary);
    }

    .modal__close svg {
      width: 14px; height: 14px;
      stroke: currentColor; fill: none; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }

    .modal__body {
      padding: 28px 32px 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-label {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .form-input,
    .form-select,
    .form-textarea {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 300;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form-input::placeholder,
    .form-textarea::placeholder {
      color: var(--text-muted);
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.6;
    }

    .form-select {
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .form-select option {
      background: var(--bg-surface);
      color: var(--text-primary);
    }

    /* Photos input */
    .photos-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .photo-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .photo-row .form-input {
      flex: 1;
    }

    .photo-row .photo-index {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--pill-bg);
      border: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .add-photo-btn {
      font-size: 12px;
      font-weight: 300;
      color: var(--text-muted);
      padding: 8px;
      border-radius: 8px;
      border: 1px dashed var(--border-subtle);
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .add-photo-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .remove-photo {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s;
      flex-shrink: 0;
    }

    .remove-photo:hover { color: var(--danger); }
    .remove-photo svg {
      width: 14px; height: 14px;
      stroke: currentColor; fill: none; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* Price configs */
    .configs-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .config-row {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .config-row .form-input {
      padding: 10px 14px;
      font-size: 13px;
    }

    .remove-config {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s;
    }

    .remove-config:hover { color: var(--danger); }
    .remove-config svg {
      width: 14px; height: 14px;
      stroke: currentColor; fill: none; stroke-width: 2;
    }

    .add-config-btn {
      font-size: 12px;
      font-weight: 300;
      color: var(--text-muted);
      padding: 8px;
      border-radius: 8px;
      border: 1px dashed var(--border-subtle);
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .add-config-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    /* Modal footer */
    .modal__footer {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      padding: 0 32px 28px;
    }

    /* ===== CONFIRM DIALOG ===== */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .confirm-overlay.open { display: flex; }

    .confirm-dialog {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 32px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
    }

    .confirm-dialog__icon {
      width: 48px; height: 48px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(200, 70, 70, 0.1);
      display: flex; align-items: center; justify-content: center;
    }

    .confirm-dialog__icon svg {
      width: 24px; height: 24px;
      stroke: var(--danger); fill: none; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }

    .confirm-dialog__title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 400;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .confirm-dialog__text {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .confirm-dialog__actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 3000;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 13px;
      font-weight: 300;
      color: var(--text-primary);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.4s var(--ease-spring);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast--success { border-left: 3px solid var(--success); }
    .toast--error { border-left: 3px solid var(--danger); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .stats { grid-template-columns: repeat(3, 1fr); }
      .config-row { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 24px 16px; }
      .stats { grid-template-columns: 1fr 1fr; }

    // ===== DATA MANAGEMENT =====
    function getObjects() {
      const stored = localStorage.getItem('phg-objects');
      if (stored) {
        try { return JSON.parse(stored); } catch(e) {}
      }
      return JSON.parse(JSON.stringify(DEFAULT_OBJECTS));
    }

    function saveObjects(objects) {
      localStorage.setItem('phg-objects', JSON.stringify(objects));
      localStorage.setItem('phg-objects-defaults', JSON.stringify(objects));
    }

    let objects = getObjects();
    let activeFilter = 'all';
    let searchQuery = '';

    const CATEGORY_LABELS = {
      novostroyki: 'Новостройки',
      poberezhie: 'Побережье',
      kommercheskaya: 'Коммерческая',
      zagorodnaya: 'Загородная'
    };

    // ===== RENDER STATS =====
    function renderStats() {
      const stats = document.getElementById('stats');
      const total = objects.length;
      const counts = {};
      objects.forEach(o => { counts[o.type] = (counts[o.type] || 0) + 1; });

      let html = `
        <div class="stat-card">
          <div class="stat-card__value">${total}</div>
          <div class="stat-card__label">Всего объектов</div>
        </div>
      `;

      Object.entries(CATEGORY_LABELS).forEach(([key, label]) => {
        html += `
          <div class="stat-card">
            <div class="stat-card__value">${counts[key] || 0}</div>
            <div class="stat-card__label">${label}</div>
          </div>
        `;
      });

      stats.innerHTML = html;
    }

    // ===== RENDER TABLE =====
    function renderTable() {
      const container = document.getElementById('tableBody');
      let filtered = objects;

      if (activeFilter !== 'all') {
        filtered = filtered.filter(o => o.type === activeFilter);
      }

      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(o => o.name.toLowerCase().includes(q) || o.location.toLowerCase().includes(q));
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg class="empty-state__icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <p class="empty-state__text">Ничего не найдено</p>
            <p class="empty-state__sub">Попробуйте изменить фильтры или добавьте новый объект</p>
          </div>
        `;
        return;
      }

      let html = `<table>
        <thead>
          <tr>
            <th>Фото</th>
            <th>Название</th>
            <th>Категория</th>
            <th>Расположение</th>
            <th>Цена</th>
            <th>Конфигурации</th>
            <th style="width:120px">Действия</th>
          </tr>
        </thead>
        <tbody>`;

      filtered.forEach((obj, i) => {
        const globalIdx = objects.indexOf(obj);
        const photo = obj.photos[0] || '';
        html += `
          <tr>
            <td>${photo ? `<img class="td-photo-thumb" src="${photo}" alt="" onerror="this.style.display='none'">` : '—'}</td>
            <td class="td-name">${obj.name}</td>
            <td><span class="td-badge">${obj.badge || CATEGORY_LABELS[obj.type] || obj.type}</span></td>
            <td>${obj.location}</td>
            <td class="td-price">${obj.priceMain}</td>
            <td>${obj.configs.length}</td>
            <td>
              <div class="td-actions">
                <button class="btn btn--secondary btn--icon btn--sm" onclick="editObject(${globalIdx})" title="Редактировать">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
                <button class="btn btn--icon btn--sm" style="border:1px solid var(--border-subtle);color:var(--text-muted)" onclick="deleteObject(${globalIdx})" title="Удалить">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                </button>
              </div>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    // ===== MODAL =====
    const modalOverlay = document.getElementById('modalOverlay');
    let currentPhotos = [''];
    let currentConfigs = [{ type: '', area: '', price: '' }];

    function openModal(index) {
      const isEdit = index >= 0;
      document.getElementById('modalTitle').textContent = isEdit ? 'Редактировать объект' : 'Добавить объект';
      document.getElementById('editIndex').value = index;

      if (isEdit) {
        const obj = objects[index];
        document.getElementById('objName').value = obj.name;
        document.getElementById('objType').value = obj.type;
        document.getElementById('objBadge').value = obj.badge;
        document.getElementById('objLocation').value = obj.location;
        document.getElementById('objDesc').value = obj.desc;
        document.getElementById('objPriceMain').value = obj.priceMain;
        document.getElementById('objMeta').value = obj.meta;
        currentPhotos = obj.photos.length ? [...obj.photos] : [''];
        currentConfigs = obj.configs.length ? [...obj.configs] : [{ type: '', area: '', price: '' }];
      } else {
        document.getElementById('objName').value = '';
        document.getElementById('objType').value = 'novostroyki';
        document.getElementById('objBadge').value = '';
        document.getElementById('objLocation').value = '';
        document.getElementById('objDesc').value = '';
        document.getElementById('objPriceMain').value = '';
        document.getElementById('objMeta').value = '';
        currentPhotos = [''];
        currentConfigs = [{ type: '', area: '', price: '' }];
      }

      renderPhotos();
      renderConfigs();
      modalOverlay.classList.add('open');
    }

    function closeModal() {
      modalOverlay.classList.remove('open');
    }

    function renderPhotos() {
      const list = document.getElementById('photosList');
      list.innerHTML = currentPhotos.map((url, i) => `
        <div class="photo-row">
          <span class="photo-index">${i + 1}</span>
          <input type="text" class="form-input" value="${url}" placeholder="https://..." data-photo-idx="${i}">
          ${currentPhotos.length > 1 ? `<button class="remove-photo" data-photo-idx="${i}"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>` : ''}
        </div>
      `).join('');

      list.querySelectorAll('[data-photo-idx]').forEach(el => {
        if (el.tagName === 'INPUT') {
          el.addEventListener('input', e => { currentPhotos[+e.target.dataset.photoIdx] = e.target.value; });
        } else {
          el.addEventListener('click', e => {
            const idx = +e.target.closest('.remove-photo').dataset.photoIdx;
            currentPhotos.splice(idx, 1);
            if (!currentPhotos.length) currentPhotos = [''];
            renderPhotos();
          });
        }
      });
    }

    function renderConfigs() {
      const list = document.getElementById('configsList');
      list.innerHTML = currentConfigs.map((c, i) => `
        <div class="config-row">
          <input type="text" class="form-input" value="${c.type}" placeholder="Тип" data-config-idx="${i}" data-config-field="type">
          <input type="text" class="form-input" value="${c.area}" placeholder="Площадь" data-config-idx="${i}" data-config-field="area">
          <input type="text" class="form-input" value="${c.price}" placeholder="Цена" data-config-idx="${i}" data-config-field="price">
          ${currentConfigs.length > 1 ? `<button class="remove-config" data-config-idx="${i}"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>` : ''}
        </div>
      `).join('');

      list.querySelectorAll('[data-config-idx]').forEach(el => {
        if (el.tagName === 'INPUT') {
          el.addEventListener('input', e => {
            const idx = +e.target.dataset.configIdx;
            const field = e.target.dataset.configField;
            currentConfigs[idx][field] = e.target.value;
          });
        } else {
          el.addEventListener('click', e => {
            const idx = +e.target.closest('.remove-config').dataset.configIdx;
            currentConfigs.splice(idx, 1);
            if (!currentConfigs.length) currentConfigs = [{ type: '', area: '', price: '' }];
            renderConfigs();
          });
        }
      });
    }

    // Modal buttons
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

    document.getElementById('addBtn').addEventListener('click', () => openModal(-1));

    document.getElementById('modalSave').addEventListener('click', () => {
      const name = document.getElementById('objName').value.trim();
      const type = document.getElementById('objType').value;
      const badge = document.getElementById('objBadge').value.trim() || CATEGORY_LABELS[type];
      const location = document.getElementById('objLocation').value.trim();
      const desc = document.getElementById('objDesc').value.trim();
      const priceMain = document.getElementById('objPriceMain').value.trim();
      const meta = document.getElementById('objMeta').value.trim();

      if (!name || !location || !desc || !priceMain) {
        showToast('Заполните обязательные поля (*)', 'error');
        return;
      }

      const photos = currentPhotos.filter(u => u.trim());
      const configs = currentConfigs.filter(c => c.type.trim());

      const obj = { name, type, badge, location, desc, priceMain, meta, photos, configs };
      const editIdx = parseInt(document.getElementById('editIndex').value);

      if (editIdx >= 0) {
        objects[editIdx] = obj;
        showToast('Объект обновлён', 'success');
      } else {
        objects.push(obj);
        showToast('Объект добавлен', 'success');
      }

      saveObjects(objects);
      renderAll();
      closeModal();
    });

    // ===== GLOBAL FUNCTIONS =====
    window.editObject = function(index) { openModal(index); };
    window.deleteObject = function(index) {
      const obj = objects[index];
      document.getElementById('confirmText').textContent = `Удалить "${obj.name}"? Это действие нельзя отменить.`;
      document.getElementById('confirmOverlay').classList.add('open');
      document.getElementById('confirmDelete').onclick = () => {
        objects.splice(index, 1);
        saveObjects(objects);
        renderAll();
        document.getElementById('confirmOverlay').classList.remove('open');
        showToast('Объект удалён', 'success');
      };
    };

    // Confirm cancel
    document.getElementById('confirmCancel').addEventListener('click', () => {
      document.getElementById('confirmOverlay').classList.remove('open');
    });

    // ===== ADD PHOTO/CONFIG =====
    document.getElementById('addPhotoBtn').addEventListener('click', () => {
      currentPhotos.push('');
      renderPhotos();
    });

    document.getElementById('addConfigBtn').addEventListener('click', () => {
      currentConfigs.push({ type: '', area: '', price: '' });
      renderConfigs();
    });

    // ===== SEARCH & FILTER =====
    document.getElementById('tableSearch').addEventListener('input', e => {
      searchQuery = e.target.value;
      renderTable();
    });

    document.querySelectorAll('.table-filter').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.table-filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        renderTable();
      });
    });

    // ===== EXPORT =====
    document.getElementById('exportBtn').addEventListener('click', () => {
      const data = JSON.stringify(objects, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'phgenier-catalog.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Каталог экспортирован', 'success');
    });

    // ===== IMPORT =====
    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (Array.isArray(data)) {
            objects = data;
            saveObjects(objects);
            renderAll();
            showToast(`Импортировано ${data.length} объектов`, 'success');
          } else {
            showToast('Неверный формат файла', 'error');
          }
        } catch(err) {
          showToast('Ошибка чтения файла', 'error');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    // ===== TOAST =====
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast toast--${type} show`;
      setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    // ===== RENDER ALL =====
    function renderAll() {
      renderStats();
      renderTable();
    }

    // ===== KEYBOARD =====
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeModal();
        document.getElementById('confirmOverlay').classList.remove('open');
      }
    });

    // ===== INIT =====
    renderAll();
  </script>
</body>
</html>
